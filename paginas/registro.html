
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - FerreMundo</title>

    <link rel="stylesheet" href="../styles/styles.css">

    
</head>
<body class="pagina-acceso">

    <header class="encabezado-login">

        <a href="./login.html" class="logo-acceso">
            <img src="../imagenes/FerreMundo.png" alt="Logo FerreMundo">
            <span>FerreMundo</span>
        </a>

    </header>

    <main class="contenedor-formulario">

        <section class="panel-acceso">

            <div class="presentacion-acceso">

                <p class="etiqueta-acceso">SUMATE A FERREMUNDO</p>

                <h1>Creá tu cuenta y empezá a explorar.</h1>

            </div>

            <div class="formulario-acceso">

                <h2 class="titulo-formulario">Crear cuenta</h2>

                <form id="formRegistro">

                    <div class="campo-formulario">

                        <label for="nombre">Nombre</label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="apellido">Apellido</label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="email">Correo electrónico</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="password">Contraseña</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="fechaNacimiento">Fecha de nacimiento</label>

                        <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required
                        >

                    </div>

                    <button type="submit" class="btnAcceso">
                        Registrarme
                    </button>

                </form>

                <p class="enlace-registro">
                    ¿Ya tenés una cuenta?
                    <a href="./login.html">Iniciar sesión</a>
                </p>

            </div>

        </section>

    </main>

    <footer class="footer-acceso">
        <p>© 2026 FerreMundo - Todos los derechos reservados.</p>
    </footer>


    <script src="../js/login.js"></script>
</body>
</html>
