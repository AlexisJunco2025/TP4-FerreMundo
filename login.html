
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FerreMundo</title>

    <link rel="stylesheet" href="./styles/styles.css">

    <script src="./js/login.js" defer></script>
</head>
<body class="pagina-acceso">

    <header class="encabezado-login">

        <a href="./login.html" class="logo-acceso">
            <img src="./imagenes/FerreMundo.png" alt="Logo FerreMundo">
            <span>FerreMundo</span>
        </a>

    </header>

    <main class="contenedor-formulario">

        <section class="panel-acceso">

            <div class="presentacion-acceso">

                <p class="etiqueta-acceso">BIENVENIDO A FERREMUNDO</p>

                <h1>Todo para tus proyectos, en un solo lugar.</h1>

            </div>

            <div class="formulario-acceso">

                <h2 class="titulo-formulario">Iniciar sesión</h2>

                <form id="formLogin">

                    <div class="campo-formulario">

                        <label for="email">Correo electrónico</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>

                    <div class="campo-formulario">

                        <label for="password">Contraseña</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>

                    <button type="submit" class="btnAcceso">
                        Ingresar
                    </button>

                </form>

                <p class="enlace-registro">
                    ¿Todavía no tenés una cuenta?
                    <a href="./registro.html">Crear una cuenta</a>
                </p>

            </div>

        </section>

    </main>

    <footer class="footer-acceso">
        <p>© 2026 FerreMundo - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
